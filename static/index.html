<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UCDB-IA | Portal Acadêmico</title>
    <link rel="stylesheet" href="/static/assets/css/style.css?v=2.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/lib/marked.umd.js"></script>
    
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: {
                fontCache: 'global'
            }
        };
    </script>
    <script type="text/javascript" id="MathJax-script" async
        src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>

<body class="estado-inicial">

    <header id="cabecalho-principal" class="header">
        <button id="btn-lateral-esquerda" class="acao-interface"><i class="fas fa-bars"></i></button>
        <a href="index.html" style="text-decoration: none; color: inherit;"><h1>UCDB-IA<span class="badge"></span></h1></a>
        <button id="btn-lateral-direita" class="acao-interface"><i class="fas fa-book-open"></i></button>
    </header>

    <main class="container-principal">

        <aside id="painel-conhecimento" class="camada-lateral esquerda">
            <div class="header-lateral">
                <h2><i class="fas fa-database"></i> Materiais</h2>
            </div>
            <div id="lista-materiais" class="scroll-content">
            </div>
        </aside>

        <section class="envolvedor-fluxo">

        <div id="tela-boas-vindas" class="welcome-container">
            <div class="hero-section">
                <h2 id="titulo-boas-vindas">O que você deseja aprender hoje?</h2>
                
                <div class="caixa-entrada-gigante">
                    <textarea id="entrada-inicial" placeholder="Faça uma busca ou selecione uma área abaixo..." rows="1"></textarea>
                    <button id="btn-enviar-inicial" type="button"><i class="fa-solid fa-paper-plane"></i></button>
                </div>
                
                <div id="area-botoes" class="hub-especialistas"> 
                    <p class="instrucao-hub">Selecione um especialista para um atendimento focado:</p>
                    <div class="grade-especialistas">
                        <button class="card-area" data-area="Engenharias" data-tema="tema-laranja">
                            <i class="fas fa-microchip"></i><span>Engenharias</span>
                        </button>
                        <button class="card-area" data-area="Saúde" data-tema="tema-verde">
                            <i class="fas fa-stethoscope"></i><span>Saúde</span>
                        </button>
                        <button class="card-area" data-area="Direito" data-tema="tema-vermelho">
                            <i class="fas fa-gavel"></i><span>Direito</span>
                        </button>
                        <button class="card-area" data-area="Humanas" data-tema="tema-roxo">
                            <i class="fas fa-users"></i><span>Humanas</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
            
            <div id="fluxo-conversa" class="area-conversa">
            </div>

            <footer id="input-persistente" class="caixa-entrada-fixa">
                <div class="entrada-wrapper">
                    <textarea id="entrada-usuario" placeholder="Continue sua dúvida..." rows="1"></textarea>
                    <button id="btn-enviar" type="button"><i class="fa-solid fa-paper-plane"></i></button>
                </div>
            </footer>

        </section>

        <aside id="painel-fontes" class="camada-lateral direita">
            <div class="header-lateral">
                <h2><i class="fas fa-scroll"></i> Referências</h2>
            </div>
            <div id="conteudo-fontes" class="scroll-content">
                <p class="vazio">As citações aparecerão aqui.</p>
            </div>
        </aside>

    </main>

   <div id="overlay-mobile" class="sidebar-overlay"></div>
     <script type="module" src="/static/assets/js/script.js?v=6.0"></script>
</body>
</html>
