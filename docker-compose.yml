services:
  # Servidor de LLM (Chat) - OTIMIZADO (Limite 4GB)
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: ucdb-llm-server
    ports:
      - "8080:8080"
    volumes:
      - D:/models:/models
    environment:
      - CUDA_VISIBLE_DEVICES=0
    command: >
      -m /models/Hermes-3-Llama-3.1-8B.Q4_K_M.gguf
      --port 8080
      --host 0.0.0.0
      -ngl 99
      -c 16384
      --parallel 1
    deploy:
      resources:
        limits:
          memory: 8GB
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Servidor de Embedding (Busca) - OTIMIZADO (Limite 2GB)
  embeddings:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: ucdb-embedding-server
    ports:
      - "8081:8081"
    volumes:
      - D:/models:/models
    environment:
      - CUDA_VISIBLE_DEVICES=0
    command: >
      -m /models/Qwen3-Embedding-0.6B-Q8_0.gguf
      --embedding
      --port 8081
      --host 0.0.0.0
      -ngl 99
      --parallel 1
    healthcheck:
      test: ["CMD", "printf", "GET /health HTTP/1.1\\nHost: localhost\\n\\n", ">", "/dev/tcp/localhost/8081"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2GB
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Backend FastAPI - OTIMIZADO (Limite 1GB)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ucdb-backend
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./pdfs:/app/pdfs
      - ./embeddings:/app/embeddings
      - ./static:/app/static
    environment:
      - SECRET_KEY=${SECRET_KEY:-chave_super_secreta_padrao}
      - LLM_BASE_URL=http://llm:8080/v1
      - EMBEDDING_API_URL=http://embeddings:8081/embedding
      - DATABASE_URL=sqlite:////app/ucdb_ia.db
    depends_on:
      - llm
      - embeddings
    deploy:
      resources:
        limits:
          memory: 1GB

  # Frontend React (Vite) - OTIMIZADO (Limite 512MB)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: ucdb-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 512MB

volumes:
  pdfs:
  embeddings:
  static:
