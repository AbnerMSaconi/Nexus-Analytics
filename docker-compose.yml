services:
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: ucdb-llm-server
    ports:
      - "8080:8080"
    volumes:
      - ${MODELS_DIR}:/models
    environment:
      - CUDA_VISIBLE_DEVICES=${CUDA_DEVICE:-0}
    command: >
      -m /models/${LLM_MODEL}
      --port 8080
      --host 0.0.0.0
      -ngl 99
      -c ${LLM_CONTEXT:-4096}
      --parallel ${LLM_PARALLEL:-1}
      --jinja
    deploy:
      resources:
        limits:
          memory: 8GB
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  embeddings:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: ucdb-embedding-server
    ports:
      - "8081:8081"
    volumes:
      - ${MODELS_DIR}:/models
    environment:
      - CUDA_VISIBLE_DEVICES=${CUDA_DEVICE:-0}
    command: >
      -m /models/${EMBEDDING_MODEL}
      --embedding
      --port 8081
      --host 0.0.0.0
      -ngl 99
      --parallel 1
    healthcheck:
      test: ["CMD", "printf", "GET /health HTTP/1.1\\nHost: localhost\\n\\n", ">", "/dev/tcp/localhost/8081"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2GB
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ucdb-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - LLM_BASE_URL=http://llm:8080/v1
      - EMBEDDING_API_URL=http://embeddings:8081/embedding
      - DATABASE_URL=sqlite:////app/ucdb_ia.db
      - MODEL_NAME=${LLM_MODEL}
      - CUDA_VISIBLE_DEVICES=${CUDA_DEVICE:-0}
    depends_on:
      - llm
      - embeddings
    deploy:
      resources:
        limits:
          memory: 1GB
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: ucdb-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 512MB
